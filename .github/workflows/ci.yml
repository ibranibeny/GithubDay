# Quality gate for every change that targets `staging` or `main`.
#
# The four job names below - frontend, backend, infrastructure, container-build -
# are the branch-protection required status checks. Renaming a job silently
# removes its gate, so treat these names as an API.
#
# `dependency-audit` is deliberately NOT one of them: advisories appear and
# disappear for reasons unrelated to the diff under review, so it reports but
# never blocks.
name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

# Read-only by default. No job here writes to the repository, publishes a
# package or touches Azure, so nothing needs more than this.
permissions:
  contents: read

# One in-flight run per pull request (or per branch for pushes). Pushing a fix
# cancels the run for the commit it replaces instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # --- REQUIRED CHECK -------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth for the Node version; keeping
          # it here means CI and a laptop cannot drift apart.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: >-
          npm test --
          --run
          --reporter=default
          --reporter=junit
          --outputFile.junit=reports/vitest-junit.xml

      - name: Build
        run: npm run build

      - name: Upload the production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload the test report
        # Uploaded even when the tests fail - that is precisely when the report
        # is worth reading.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: frontend/reports
          retention-days: 7
          if-no-files-found: warn

  # --- REQUIRED CHECK -------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        # setup-uv stopped publishing floating major tags at v8.0.0, so `@v10`
        # does not resolve. The exact immutable release tag is required.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependency set
        # --frozen fails rather than silently re-resolving, so CI tests exactly
        # the versions recorded in uv.lock.
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Tests with coverage
        # pyproject sets addopts = ["-m", "not integration"], so the container
        # suite is deselected here; container-build runs it with `-m integration`.
        run: >-
          uv run pytest
          --cov=cost_copilot
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=reports/pytest-junit.xml

      - name: Upload coverage and the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/reports
          retention-days: 7
          if-no-files-found: warn

  # --- REQUIRED CHECK -------------------------------------------------------
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Shellcheck the provisioning scripts
        run: shellcheck infra/scripts/*.sh

      - name: Bats suites
        # A directory argument picks up whatever *.bats files exist, so suites
        # added later need no change here.
        run: bats infra/tests

  # --- REQUIRED CHECK -------------------------------------------------------
  container-build:
    name: container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Build both images
        run: docker compose build

      - name: Scan the API image
        # Advisory only. A newly published CVE in a base image is not a reason
        # to block an unrelated pull request, so this never fails the job.
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: azure-cost-copilot-api:local
          only-severities: critical,high
          exit-code: false

      - name: Start the composition
        run: docker compose up -d

      - name: Install the locked dependency set
        working-directory: backend
        run: uv sync --frozen

      - name: Container health integration test
        working-directory: backend
        # The marker is deselected by default in pyproject; opting in explicitly
        # is the only way this suite runs.
        run: uv run pytest -m integration

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans --volumes

  # --- ADVISORY ONLY (not a required check) ---------------------------------
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        working-directory: frontend
        run: npm ci

      - name: npm audit (runtime dependencies)
        # Reports every advisory it finds but does not gate the merge; the
        # summary in the log is the deliverable.
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: pip-audit (runtime dependencies)
        continue-on-error: true
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --output-file requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt
