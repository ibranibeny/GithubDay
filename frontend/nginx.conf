# Server block for the SPA image. nginx-unprivileged runs as uid 101, which
# cannot bind a privileged port, so the container listens on 8080.
#
# nginx add_header semantics: a location that declares any add_header discards
# every add_header inherited from the server block. The security headers are
# therefore repeated in each location that sets its own Cache-Control.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The container sits behind Front Door, so redirects must not leak the
    # internal scheme/port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container liveness: answered by nginx itself, no filesystem dependency.
    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    # Written at container start from the template; it differs per environment,
    # so it must never be cached by a browser or an edge.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite emits content-hashed filenames here, so the bytes behind a URL never
    # change and the response can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The entry document is not hashed, so a stale copy would pin users to an
    # old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
