[project]
name = "azure-cost-copilot-api"
version = "0.1.0"
description = "Azure Cost Copilot backend API"
requires-python = ">=3.13"
dependencies = [
  "azure-identity>=1.25,<2",
  "azure-monitor-opentelemetry>=1.8,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=2.46,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# Pinned so the lockfile resolves against public PyPI regardless of any
# UV_DEFAULT_INDEX pointing at an internal mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts; scope the exemption instead of dropping S globally.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
